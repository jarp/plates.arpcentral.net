# Netlify configuration for the Plates website.
# Plain static site: no build step, publish the repo root.

[build]
  publish = "."
  command = ""

# Serve /privacy as well as /privacy.html so the Play Store link can be short.
[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
